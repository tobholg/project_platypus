[package]
name = "platypus"
description = "The game: Bevy plugins gluing the simulation crates to rendering, input and gameplay."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
platypus_sim.workspace = true
platypus_worldgen.workspace = true
platypus_physics.workspace = true
bevy.workspace = true
rayon.workspace = true
serde.workspace = true
ron.workspace = true
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }

[features]
# Log a per-system breakdown of every slow frame (see src/spikes.rs).
spikes = ["bevy/trace", "bevy/debug", "dep:tracing", "dep:tracing-subscriber"]

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
platypus_sim      = { path = "crates/sim" }
platypus_worldgen = { path = "crates/worldgen" }
platypus_physics  = { path = "crates/physics" }
bevy       = "0.19.1"
rayon      = "1.12"
noise      = "0.9"
bytemuck   = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
serde      = { version = "1", features = ["derive"] }
ron        = "0.12"
lz4_flex   = "0.14"
rustc-hash = "2.1"
# Same version bevy_math uses, so Vec2 is literally the same type on both sides.
glam       = "0.32"

# The simulation is unusable unoptimised; keep it fast even in dev builds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.platypus_sim]
opt-level = 3
[profile.dev.package.platypus_worldgen]
opt-level = 3

[profile.release]
debug = "line-tables-only"
